name: Newman Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-newman:
    runs-on: ubuntu-latest

    # Permisos necesarios para que el GITHUB_TOKEN pueda actualizar la rama gh-pages
    permissions:
      contents: write

    env:
      API_USER: ${{ secrets.API_USER }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}

    steps:
      # 1. Descargar el código fuente del repositorio
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Configurar el entorno de ejecución Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # 3. Instalar la herramienta Newman de manera global
      - name: Install Newman
        run: npm install -g newman

      # 4. Instalar la ÚLTIMA versión del reporter Allure para Newman
      - name: Install Newman Reporters
        run: npm install --save-dev newman-reporter-allure@latest

      # 5. Ejecutar los tests de Postman y guardar los resultados crudos (.json)
      - name: Run Postman Collection
        run: |
          mkdir -p output/allure-results
          npx newman run Todoly.postman_collection.json \
            -e Todoly_UAT.postman_environment.json \
            --env-var "userName=$API_USER" \
            --env-var "password=$API_PASSWORD" \
            --reporters cli,allure \
            --reporter-allure-resultsDir output/allure-results
        continue-on-error: true

      # 5b. Verificación rápida de que sí se generaron resultados
      - name: Debug - Verify allure-results
        if: always()
        run: |
          echo "Contenido de output/allure-results:"
          ls -la output/allure-results/ || echo "❌ La carpeta no existe"
          count=$(find output/allure-results -name "*.json" 2>/dev/null | wc -l)
          echo "Archivos .json encontrados: $count"

      # 6. Descargar el historial previo desde 'gh-pages' para no perder gráficos de tendencias
      - name: Get Allure history
        uses: actions/checkout@v7
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 7. Generar el reporte con Allure Report v3 (última versión, con historial nativo)
      - name: Generate Allure Report (v3)
        uses: yuvalgabay/allure-v3-report-action@v1
        if: always()
        with:
          allure_results: output/allure-results
          allure_history: allure-history

      # 8. Desplegar los archivos HTML estáticos procesados a GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history