name: Newman Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-newman:
    runs-on: ubuntu-latest

    env:
      API_USER: ${{ secrets.API_USER }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}



    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Instalar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # 3. Instalar Newman
      - name: Install Newman
        run: npm install -g newman

      # 4. Instalar Newman Reporters
      - name: Install Newman Reporters
        run: npm install --save-dev newman-reporter-allure

      # 5. Ejecutar colección con reporter Allure
      - name: Run Postman Collection
        run: |
          mkdir -p allure-results
          npx newman run Todoly.postman_collection.json \
            -e Todoly_UAT.postman_environment.json \
            --env-var "userName=$API_USER" \
            --env-var "password=$API_PASSWORD" \
            -reporters cli,allure \
            --reporter-allure-resultsDir allure-results
        continue-on-error: true

      # 6. Generar el historial y el reporte de Allure usando una acción comunitaria
      - name: Load Allure history and Generate Report
        # Nota: Puedes usar acciones como simple-elf/allure-report-action para simplificar la generación
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: output/allure-results
          allure_history: allure-history
          keep_reports: 20

      # 7. Publicar el reporte generado en la rama 'gh-pages'
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history